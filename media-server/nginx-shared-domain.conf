# Single ngrok domain → Nginx :8088 → apps by path
#
#   /         → Eco Fam Vault  :3847
#   /chorus/  → Karaoke media  :4050
#   /other/   → optional app   :3000
#
# Install:
#   sudo apt update && sudo apt install -y nginx
#   sudo cp ~/karaoke/media-server/nginx-shared-domain.conf /etc/nginx/sites-available/chorus-share
#   sudo ln -sf /etc/nginx/sites-available/chorus-share /etc/nginx/sites-enabled/chorus-share
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx

server {
    listen 8088;
    server_name _;

    client_max_body_size 512m;

    # Karaoke media server (songs + room/queue JSON)
    location /chorus/ {
        proxy_pass http://127.0.0.1:4050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Media-Secret $http_x_media_secret;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Optional second app
    location /other/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eco Fam Vault (root)
    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
